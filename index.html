<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>To-do</title>
    <meta name="description" content="A to-do list with drag to reorder, undo, filters and a little celebration when you finish." />
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
    <script>
      // Set the theme before first paint so there is no flash of the wrong one.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("todo:theme") ||
          (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <div class="aurora" aria-hidden="true"></div>
    <div class="dots" aria-hidden="true"></div>

    <button class="theme" id="theme" type="button" aria-label="Switch theme">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></svg>
    </button>

    <main class="app">
      <header class="head">
        <div>
          <p class="date" id="date">&nbsp;</p>
          <h1 id="greeting">Hello</h1>
          <p class="summary" id="summary">&nbsp;</p>
        </div>
        <div class="ring" id="ring" role="img" aria-label="0% done">
          <svg viewBox="0 0 44 44" aria-hidden="true">
            <defs>
              <linearGradient id="ring-gradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#818cf8" />
                <stop offset="1" stop-color="#34d399" />
              </linearGradient>
            </defs>
            <circle class="ring-track" cx="22" cy="22" r="19" />
            <circle class="ring-progress" id="ring-progress" cx="22" cy="22" r="19" pathLength="100" />
          </svg>
          <span class="ring-label" id="ring-label">0%</span>
        </div>
      </header>

      <form class="add" id="add-form" autocomplete="off">
        <input id="new-task" placeholder="Add a task…" maxlength="200" aria-label="New task" enterkeyhint="done" />
        <button type="submit" aria-label="Add task">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        </button>
      </form>

      <nav class="tabs" id="tabs" aria-label="Show">
        <a href="#all" data-filter="all">All <span id="count-all">0</span></a>
        <a href="#active" data-filter="active">To do <span id="count-active">0</span></a>
        <a href="#done" data-filter="done">Done <span id="count-done">0</span></a>
      </nav>

      <ul class="tasks" id="list" aria-label="Tasks"></ul>

      <div class="empty" id="empty" hidden>
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <rect class="board" x="26" y="18" width="68" height="88" rx="12" />
          <rect class="clip" x="44" y="12" width="32" height="14" rx="6" />
          <path class="tick t1" d="M38 46l5 5 9-10" />
          <path class="line l1" d="M60 46h20" />
          <path class="tick t2" d="M38 66l5 5 9-10" />
          <path class="line l2" d="M60 66h20" />
          <path class="tick t3" d="M38 86l5 5 9-10" />
          <path class="line l3" d="M60 86h14" />
        </svg>
        <p id="empty-text"></p>
      </div>

      <footer class="foot">
        <span id="left">0 tasks left</span>
        <button type="button" class="link" id="clear-done">Clear completed</button>
      </footer>
    </main>

    <p class="hint">
      Paste a list to add many at once · drag <kbd>⋮⋮</kbd> or press <kbd>Alt</kbd>+<kbd>↑</kbd>/<kbd>↓</kbd> to reorder ·
      <kbd>F2</kbd> to rename · <kbd>/</kbd> to add
    </p>

    <div class="toast" id="toast" hidden>
      <span id="toast-text"></span>
      <button type="button" id="undo">Undo</button>
    </div>
    <p class="visually-hidden" id="announce" aria-live="polite"></p>
  </body>
</html>
